<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="spaceGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#242142"/>
      <stop offset="100%" stop-color="#171629"/>
    </radialGradient>
    <linearGradient id="orbitGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#AAA0FF"/>
      <stop offset="100%" stop-color="#8ADBD0"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8ADBD0"/>
      <stop offset="100%" stop-color="#56B8AB"/>
    </linearGradient>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#spaceGlow)"/>
  
  <!-- Subtle coordinate grid rings (Atlas motif) -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="#AAA0FF" stroke-opacity="0.12" stroke-width="2" stroke-dasharray="6 6"/>
  <circle cx="256" cy="256" r="120" fill="none" stroke="#8ADBD0" stroke-opacity="0.16" stroke-width="2"/>
  
  <!-- Celestial Astrolabe / Orbit Line -->
  <ellipse cx="256" cy="256" rx="200" ry="76" fill="none" stroke="url(#orbitGrad)" stroke-width="4" stroke-opacity="0.75" transform="rotate(-28 256 256)"/>

  <!-- Crescent Moon (Nocturne motif) -->
  <path d="M 276 136 C 200 136 142 198 142 276 C 142 354 204 416 282 416 C 330 416 370 392 394 356 C 324 362 262 306 262 236 C 262 186 288 152 276 136 Z" 
        fill="url(#mintGrad)"/>

  <!-- Guiding Star / Polaris coordinate (Afterglow accent) -->
  <circle cx="344" cy="180" r="8" fill="#FF947F"/>
  <circle cx="344" cy="180" r="16" fill="#FF947F" fill-opacity="0.25"/>
</svg>
